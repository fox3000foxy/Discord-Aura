<html class="theme-dark" ondrop="dropHandler(event);" ondragover="dragOverHandler(event);">
<title>Aura UI</title>
<link rel="stylesheet" href="buttons.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="main.css">
<div id="dropZone" style="display:none" ondragleave="dropZone.style.display='none'"></div>
<div align="center">
	<table>
		<form onsubmit='
		event.preventDefault();
		if (document.whForm.content.value.split(" ").join("")!="") socket.emit("wh",{
			username: document.whForm.username.value,
			avatar: document.whForm.avatar_url.value,
			content: document.whForm.content.value,
			channelId: selectChannel.value
		})
		this.content.value=""
		return false
		' method="GET" name="whForm">
		<div id="serverList"></div>
		<div style="position:absolute;top:-1000px">
			<input name="avatar_url" onchange="localStorage.setItem('avatar_url',this.value);document.getElementById('image').src=this.value"><br />
			<input id="serverId" onchange="
				localStorage.setItem('serverId',this.value);
				changing = 1;
				askForServerChannels(this.value);
			" type="number"><br>
			<input type="checkbox" id="autoscroll" checked="true"> Autoscroll
		</div>
		<select id="channelNames" multiple onchange="
			localStorage.setItem('selectedChannel',this.selectedIndex);
			askChannels();
			messageContainer.innerHTML = ''
			document.getElementById('channelName').innerHTML = `<b style='color:gray'># </b>`+selectChannel.selectedOptions[0].innerText;
			document.getElementById('channelTopic').innerHTML = ''
		"></select>
		<div id="serverName"></div>
		<div style="text-align:center;position:absolute;left:64px;bottom:0;background:#36393f;width:calc(20% - 64px);height:calc(15% - 43px);padding-top:10px">
			<img id="image" width="64px" height="64px" onclick="
			linkOfPP = prompt('Lien de la photo de profile',this.src)
			if(linkOfPP != null)
			document.whForm.avatar_url.value = linkOfPP
			localStorage.setItem('avatar_url',document.whForm.avatar_url.value);document.getElementById('image').src=document.whForm.avatar_url.value
			" alt="Photo de profile" onerror="this.src='default.png'" style="border-radius:32px"><br>
			<input name="username" style="width:100%" onchange="localStorage.setItem('username',this.value)" class="username" placeholder="Nom d'utilisateur"><br /><br />
		</div>
		<div id="messageContainer">Messages loading... Please wait...</div>
		<div id="channelName"></div>
		<div id="channelTopic"></div>
		<div id="serverMembers" onclick="askMemberList()" style="display:block;overflow-x: hidden;text-align:left;position:absolute;left:80%;top:0;width:20%;height:100%;background:#202225">
		</div>
		<input autocomplete="off" name="content" placeholder="Envoyez un message... Cliquez sur un profil ou une mention pour mentionner..."><br />
		<input type="submit">
	</form>
</table>
<div class="layerContainer-yqaFcK" id="promptBox" style="display:none"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/prompt.js"></script>
<script src="/emojiList.js"></script>
<script src="/main.js"></script>
<script src="/drop.js"></script>
</html>
